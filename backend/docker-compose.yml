version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: mealloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealloop
      POSTGRES_USER: mealloop
      POSTGRES_PASSWORD: mealloop_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealloop_fastapi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mealloop:mealloop_dev_password@db:5432/mealloop
      RAZORPAY_KEY_ID: rzp_test_campus_mock_key
      RAZORPAY_KEY_SECRET: rzp_test_mock_secret
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
